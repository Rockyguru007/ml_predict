<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5">

        <h1 class="mb-4">FWI Prediction</h1>

        <!-- Main Input For Receiving Query to our ML -->
        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <div class="mb-2">
                <input type="number" step="any" class="form-control" name="Temperature" placeholder="Temperature"
                    required>
            </div>
            <div class="mb-2">
                <input type="number" step="any" class="form-control" name="RH" placeholder="RH" required>
            </div>
            <div class="mb-2">
                <input type="number" step="any" class="form-control" name="Ws" placeholder="Ws" required>
            </div>
            <div class="mb-2">
                <input type="number" step="any" class="form-control" name="Rain" placeholder="Rain" required>
            </div>
            <div class="mb-2">
                <input type="number" step="any" class="form-control" name="FFMC" placeholder="FFMC" required>
            </div>
            <div class="mb-2">
                <input type="number" step="any" class="form-control" name="DMC" placeholder="DMC" required>
            </div>
            <div class="mb-2">
                <input type="number" step="any" class="form-control" name="ISI" placeholder="ISI" required>
            </div>
            <div class="mb-2">
                <input type="number" step="any" class="form-control" name="Classes" placeholder="Classes" required>
            </div>
            <div class="mb-3">
                <input type="number" step="any" class="form-control" name="Region" placeholder="Region" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">
                Predict
            </button>

        </form>

        {% if result is not none %}
        <h2 class="mt-4">
            The FWI prediction is <strong>{{ result }}</strong>
        </h2>
        {% endif %}

    </div>
</body>

</html>
